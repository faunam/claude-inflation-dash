name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily at 14:00 UTC, after BLS/BEA releases (8:30 AM ET) reach FRED.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch FRED data
        run: npm run fetch-data
        env:
          # Optional. Without it the script uses FRED's public CSV download.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
