<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inflation Dashboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Inflation, past 12 months</h1>
        <p class="sub">Year-over-year % change in prices, by month. <span id="updated"></span></p>
      </header>

      <section class="card">
        <h2>CPI, PCE and PPI</h2>
        <div class="chart"><canvas id="headline-chart" aria-label="Year-over-year change in CPI, PCE and PPI over the past 12 months" role="img"></canvas></div>
        <dl id="definitions" class="definitions"></dl>
      </section>

      <section class="card">
        <h2>CPI by category</h2>
        <p class="note">The eight major groups of the CPI basket. Dashed gray is overall CPI.</p>
        <div class="chart tall"><canvas id="category-chart" aria-label="Year-over-year change in each CPI category over the past 12 months" role="img"></canvas></div>
        <table id="category-table" class="latest"></table>
      </section>

      <p id="error" class="error" hidden></p>
      <footer>Data: <a href="https://fred.stlouisfed.org/">FRED, Federal Reserve Bank of St. Louis</a>. All series seasonally adjusted.</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
